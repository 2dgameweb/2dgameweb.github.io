<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuga dal Mostro - Match Puzzle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Arial Black', 'Arial Bold', sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  
  .container {
    position: relative;
    width: 100%;
    max-width: 700px;
    padding: 20px;
  }
  
  canvas {
    display: block;
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 0 50px rgba(78, 205, 196, 0.3), 0 20px 60px rgba(0,0,0,0.8);
    cursor: pointer;
    background: #1a1a2e;
  }
  
  .menu-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(26, 26, 46, 0.98);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 40px;
    text-align: center;
    border: 3px solid rgba(255,217,61,0.6);
    box-shadow: 0 0 80px rgba(255,217,61,0.3), 0 20px 60px rgba(0,0,0,0.9);
    z-index: 10;
    min-width: 380px;
    animation: menuFloat 3s ease-in-out infinite;
  }
  
  @keyframes menuFloat {
    0%, 100% { transform: translate(-50%, -50%) translateY(0); }
    50% { transform: translate(-50%, -50%) translateY(-10px); }
  }
  
  .menu-overlay h1 {
    color: #ffd93d;
    font-size: 2.5em;
    text-shadow: 0 0 20px #ffd93d, 3px 3px 0 #ff6b6b;
    margin-bottom: 15px;
    animation: titlePulse 1.5s infinite;
  }
  
  @keyframes titlePulse {
    0%, 100% { transform: scale(1); text-shadow: 0 0 20px #ffd93d, 3px 3px 0 #ff6b6b; }
    50% { transform: scale(1.05); text-shadow: 0 0 40px #ffd93d, 3px 3px 0 #ff6b6b; }
  }
  
  .menu-overlay .subtitle {
    color: #4ecdc4;
    font-size: 1.1em;
    margin-bottom: 25px;
    text-shadow: 0 0 10px rgba(78,205,196,0.5);
  }
  
  .instructions {
    background: rgba(0,0,0,0.5);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .instructions h3 {
    color: #ffd93d;
    margin-bottom: 12px;
    font-size: 1.1em;
  }
  
  .instructions ul {
    list-style: none;
    text-align: left;
  }
  
  .instructions li {
    color: #fff;
    font-size: 0.85em;
    margin: 8px 0;
    padding-left: 25px;
    position: relative;
    line-height: 1.4;
    font-family: Arial, sans-serif;
  }
  
  .instructions li::before {
    content: '◆';
    position: absolute;
    left: 5px;
    color: #4ecdc4;
  }
  
  .btn {
    display: block;
    width: 100%;
    padding: 16px 30px;
    font-size: 1.3em;
    font-weight: bold;
    font-family: inherit;
    color: white;
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 0 #c93d3d, 0 0 30px rgba(255,107,107,0.5);
    transition: all 0.15s;
    margin-bottom: 12px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
  }
  
  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 11px 0 #c93d3d, 0 0 50px rgba(255,107,107,0.7);
  }
  
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #c93d3d, 0 0 20px rgba(255,107,107,0.4);
  }
  
  .btn.secondary {
    background: linear-gradient(135deg, #4ecdc4, #44a3aa);
    box-shadow: 0 8px 0 #2d7a74, 0 0 30px rgba(78,205,196,0.5);
  }
  
  .btn.secondary:hover {
    box-shadow: 0 11px 0 #2d7a74, 0 0 50px rgba(78,205,196,0.7);
  }
  
  .btn.secondary:active {
    box-shadow: 0 4px 0 #2d7a74, 0 0 20px rgba(78,205,196,0.4);
  }
  
  .hidden { display: none !important; }
  
  .mute-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.3);
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.3em;
    z-index: 20;
    transition: all 0.2s;
  }
  
  .mute-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.1);
  }
  
  @media (max-width: 600px) {
    .menu-overlay { min-width: 300px; padding: 25px; }
    .menu-overlay h1 { font-size: 1.8em; }
  }
</style>
</head>
<body>

<div class="container">
  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">♪</button>
  <canvas id="gameCanvas" width="700" height="850"></canvas>
  
  <div class="menu-overlay" id="menu">
    <h1>FUGA DAL MOSTRO</h1>
    <p class="subtitle">Match &amp; Run</p>
    
    <div class="instructions">
      <h3>COME SI GIOCA</h3>
      <ul>
        <li>Scambia due blocchi adiacenti con un click</li>
        <li>Allinea 3 o più simboli uguali per eliminarli</li>
        <li>Ogni match fa correre l'omino verso il traguardo</li>
        <li>Raggiungi la bandiera per passare al livello dopo</li>
        <li>Il mostro accelera: non perdere tempo!</li>
      </ul>
    </div>
    
    <button class="btn" onclick="startGame(1)">GIOCA - NORMALE</button>
    <button class="btn secondary" onclick="startGame(2)">GIOCA - DIFFICILE</button>
  </div>
</div>

<script>
// ==================== AUDIO SYSTEM ====================
class AudioSystem {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.initialized = false;
  }
  
  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.initialized = true;
    } catch(e) {}
  }
  
  play(type) {
    if (this.muted || !this.initialized) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    
    switch(type) {
      case 'select': this.playTone(400, 0.08, 'sine', 0.15); break;
      case 'swap': this.playSwap(); break;
      case 'match': this.playMatch(); break;
      case 'explosion': this.playExplosion(); break;
      case 'invalid': this.playInvalid(); break;
      case 'levelup': this.playLevelUp(); break;
      case 'win': this.playWin(); break;
      case 'lose': this.playLose(); break;
      case 'tick': this.playTone(800, 0.03, 'square', 0.05); break;
    }
  }
  
  playTone(freq, duration, type = 'sine', volume = 0.2) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + duration);
  }
  
  playSwap() {
    const t = this.ctx.currentTime;
    [300, 400, 500].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.06, 'sine', 0.1), i * 30);
    });
  }
  
  playMatch() {
    const t = this.ctx.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.15, 'sine', 0.15), i * 60);
    });
  }
  
  playExplosion() {
    if (!this.ctx) return;
    const bufferSize = this.ctx.sampleRate * 0.3;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const source = this.ctx.createBufferSource();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
    source.buffer = buffer;
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    source.start();
  }
  
  playInvalid() {
    this.playTone(200, 0.1, 'sawtooth', 0.1);
    setTimeout(() => this.playTone(150, 0.1, 'sawtooth', 0.1), 80);
  }
  
  playLevelUp() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.2, 'sine', 0.15), i * 100);
    });
  }
  
  playWin() {
    [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.25, 'sine', 0.12), i * 120);
    });
  }
  
  playLose() {
    [400, 350, 300, 250, 200].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.3, 'sawtooth', 0.08), i * 150);
    });
  }
  
  toggleMute() {
    this.muted = !this.muted;
    document.getElementById('muteBtn').textContent = this.muted ? '✕' : '♪';
  }
}

const audio = new AudioSystem();
function toggleMute() { audio.toggleMute(); }

// ==================== GAME STATE ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'menu';
let gridSize = 7;
let cellSize = 68;
let gridOffsetX = 113;
let gridOffsetY = 330;
let grid = [];
let selectedCell = null;
let timeLeft = 60;
let maxTime = 60;
let heroPos = 0;
let monsterPos = -15;
let goalPos = 90;
let difficulty = 1;
let score = 0;
let level = 1;
let combo = 0;
let lastMatchTime = 0;

let animationTime = 0;
let particles = [];
let floatingTexts = [];
let screenShake = 0;
let flashAlpha = 0;
let swapAnimation = null;
let isProcessing = false;

const symbols = [
  { type: 'circle', color: '#ff6b6b', glow: '#ff9999' },
  { type: 'square', color: '#4ecdc4', glow: '#7ee8e0' },
  { type: 'triangle', color: '#ffd93d', glow: '#ffe580' },
  { type: 'diamond', color: '#a29bfe', glow: '#c8c4ff' },
  { type: 'star', color: '#fd79a8', glow: '#ffa8cc' },
  { type: 'hexagon', color: '#74b9ff', glow: '#a8d5ff' }
];

// ==================== GAME FUNCTIONS ====================
function startGame(diff) {
  audio.init();
  difficulty = diff;
  maxTime = diff === 1 ? 60 : 45;
  timeLeft = maxTime;
  heroPos = 0;
  monsterPos = -15;
  score = 0;
  level = 1;
  combo = 0;
  generateGrid();
  gameState = 'playing';
  document.getElementById('menu').classList.add('hidden');
  audio.play('levelup');
  requestAnimationFrame(gameLoop);
}

function nextLevel() {
  level++;
  timeLeft = Math.min(maxTime, timeLeft + 15);
  heroPos = 0;
  monsterPos = -15 - level * 2;
  goalPos = Math.min(95, 90 + level * 2);
  combo = 0;
  generateGrid();
  gameState = 'playing';
  audio.play('levelup');
  flashAlpha = 0.5;
  screenShake = 10;
  spawnLevelUpText();
}

function generateGrid() {
  grid = [];
  const numSymbols = Math.min(6, 4 + Math.floor(level / 2));
  for (let r = 0; r < gridSize; r++) {
    grid[r] = [];
    for (let c = 0; c < gridSize; c++) {
      let symbol;
      do {
        symbol = symbols[Math.floor(Math.random() * numSymbols)];
      } while (wouldCreateMatch(r, c, symbol));
      grid[r][c] = { ...symbol, offsetY: 0, scale: 1, alpha: 1 };
    }
  }
}

function wouldCreateMatch(row, col, symbol) {
  let count = 1;
  if (col > 0 && grid[row][col-1]?.type === symbol.type) count++;
  if (col > 1 && grid[row][col-2]?.type === symbol.type) count++;
  if (count >= 3) return true;
  
  count = 1;
  if (row > 0 && grid[row-1]?.[col]?.type === symbol.type) count++;
  if (row > 1 && grid[row-2]?.[col]?.type === symbol.type) count++;
  if (count >= 3) return true;
  
  return false;
}

canvas.addEventListener('click', (e) => {
  if (gameState !== 'playing' || isProcessing) return;
  
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  
  const col = Math.floor((x - gridOffsetX) / cellSize);
  const row = Math.floor((y - gridOffsetY) / cellSize);
  
  if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
    if (!selectedCell) {
      selectedCell = { row, col };
      audio.play('select');
    } else if (selectedCell.row === row && selectedCell.col === col) {
      selectedCell = null;
    } else if (isAdjacent(selectedCell.row, selectedCell.col, row, col)) {
      startSwap(selectedCell.row, selectedCell.col, row, col);
      selectedCell = null;
    } else {
      selectedCell = { row, col };
      audio.play('select');
    }
  }
});

function isAdjacent(r1, c1, r2, c2) {
  return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
}

function startSwap(r1, c1, r2, c2) {
  isProcessing = true;
  swapAnimation = { r1, c1, r2, c2, progress: 0, reverting: false };
  audio.play('swap');
}

function updateSwapAnimation() {
  if (!swapAnimation) return;
  
  swapAnimation.progress += 0.08;
  
  if (swapAnimation.progress >= 1) {
    if (!swapAnimation.reverting) {
      const { r1, c1, r2, c2 } = swapAnimation;
      const temp = grid[r1][c1];
      grid[r1][c1] = grid[r2][c2];
      grid[r2][c2] = temp;
      
      if (checkAndRemoveMatches()) {
        swapAnimation = null;
        setTimeout(() => { isProcessing = false; }, 300);
      } else {
        grid[r2][c2] = grid[r1][c1];
        grid[r1][c1] = temp;
        swapAnimation.reverting = true;
        swapAnimation.progress = 0;
        audio.play('invalid');
      }
    } else {
      swapAnimation = null;
      isProcessing = false;
    }
  }
}

function checkAndRemoveMatches() {
  const toRemove = new Set();
  
  for (let r = 0; r < gridSize; r++) {
    let count = 1;
    for (let c = 1; c < gridSize; c++) {
      if (grid[r][c] && grid[r][c-1] && grid[r][c].type === grid[r][c-1].type) {
        count++;
      } else {
        if (count >= 3) {
          for (let k = c - count; k < c; k++) toRemove.add(`${r},${k}`);
        }
        count = 1;
      }
    }
    if (count >= 3) {
      for (let k = gridSize - count; k < gridSize; k++) toRemove.add(`${r},${k}`);
    }
  }
  
  for (let c = 0; c < gridSize; c++) {
    let count = 1;
    for (let r = 1; r < gridSize; r++) {
      if (grid[r][c] && grid[r-1][c] && grid[r][c].type === grid[r-1][c].type) {
        count++;
      } else {
        if (count >= 3) {
          for (let k = r - count; k < r; k++) toRemove.add(`${k},${c}`);
        }
        count = 1;
      }
    }
    if (count >= 3) {
      for (let k = gridSize - count; k < gridSize; k++) toRemove.add(`${k},${c}`);
    }
  }
  
  if (toRemove.size > 0) {
    const now = Date.now();
    if (now - lastMatchTime < 2000) combo++;
    else combo = 1;
    lastMatchTime = now;
    
    toRemove.forEach(key => {
      const [r, c] = key.split(',').map(Number);
      const x = gridOffsetX + c * cellSize + cellSize / 2;
      const y = gridOffsetY + r * cellSize + cellSize / 2;
      spawnExplosion(x, y, grid[r][c].color, grid[r][c].glow);
      grid[r][c] = null;
    });
    
    const points = toRemove.size * 10 * combo;
    score += points;
    heroPos = Math.min(goalPos, heroPos + toRemove.size * (1.2 + combo * 0.2));
    
    spawnFloatingText(`+${points}`, canvas.width / 2, gridOffsetY - 20);
    if (combo > 1) spawnFloatingText(`COMBO x${combo}!`, canvas.width / 2, gridOffsetY - 50, '#ffd93d');
    
    screenShake = Math.min(15, 5 + toRemove.size);
    audio.play('match');
    if (toRemove.size >= 4) audio.play('explosion');
    
    setTimeout(() => {
      applyGravity();
      setTimeout(() => checkAndRemoveMatches(), 250);
    }, 200);
    
    if (heroPos >= goalPos) {
      setTimeout(() => {
        if (gameState === 'playing') {
          gameState = 'levelcomplete';
          audio.play('levelup');
          flashAlpha = 0.8;
          screenShake = 15;
          setTimeout(() => nextLevel(), 1500);
        }
      }, 500);
    }
    
    return true;
  }
  
  return false;
}

function applyGravity() {
  for (let c = 0; c < gridSize; c++) {
    let writePos = gridSize - 1;
    for (let r = gridSize - 1; r >= 0; r--) {
      if (grid[r][c] !== null) {
        if (writePos !== r) {
          grid[writePos][c] = grid[r][c];
          grid[writePos][c].offsetY = (r - writePos) * cellSize;
          grid[r][c] = null;
        }
        writePos--;
      }
    }
    
    for (let r = writePos; r >= 0; r--) {
      const numSymbols = Math.min(6, 4 + Math.floor(level / 2));
      grid[r][c] = { ...symbols[Math.floor(Math.random() * numSymbols)], offsetY: -(writePos - r + 2) * cellSize, scale: 1, alpha: 1 };
    }
  }
}

function spawnExplosion(x, y, color, glow) {
  for (let i = 0; i < 15; i++) {
    const angle = (Math.PI * 2 * i) / 15 + Math.random() * 0.5;
    const speed = 3 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      color: Math.random() > 0.5 ? color : glow,
      size: 3 + Math.random() * 6,
      type: Math.random() > 0.7 ? 'spark' : 'circle'
    });
  }
  
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y + (Math.random() - 0.5) * 20,
      vx: (Math.random() - 0.5) * 2,
      vy: -2 - Math.random() * 3,
      life: 1,
      color: '#fff',
      size: 2 + Math.random() * 3,
      type: 'trail'
    });
  }
}

function spawnFloatingText(text, x, y, color = '#4ecdc4') {
  floatingTexts.push({ text, x, y, life: 1, color });
}

function spawnLevelUpText() {
  spawnFloatingText(`LIVELLO ${level}!`, canvas.width / 2, canvas.height / 2, '#ffd93d');
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25;
    p.life -= 0.02;
    return p.life > 0;
  });
  
  floatingTexts = floatingTexts.filter(t => {
    t.y -= 1;
    t.life -= 0.02;
    return t.life > 0;
  });
}

// ==================== DRAWING ====================
function drawSymbol(x, y, symbol, size) {
  ctx.save();
  ctx.globalAlpha = symbol.alpha || 1;
  
  ctx.shadowColor = symbol.glow;
  ctx.shadowBlur = 15;
  
  const gradient = ctx.createRadialGradient(x - size*0.15, y - size*0.15, 0, x, y, size * 0.5);
  gradient.addColorStop(0, symbol.glow);
  gradient.addColorStop(1, symbol.color);
  ctx.fillStyle = gradient;
  
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  
  const s = size * (symbol.scale || 1);
  
  switch (symbol.type) {
    case 'circle':
      ctx.beginPath();
      ctx.arc(x, y, s * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      break;
      
    case 'square':
      const ss = s * 0.65;
      ctx.fillRect(x - ss/2, y - ss/2, ss, ss);
      ctx.strokeRect(x - ss/2, y - ss/2, ss, ss);
      break;
      
    case 'triangle':
      ctx.beginPath();
      ctx.moveTo(x, y - s * 0.4);
      ctx.lineTo(x - s * 0.38, y + s * 0.28);
      ctx.lineTo(x + s * 0.38, y + s * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      break;
      
    case 'diamond':
      ctx.beginPath();
      ctx.moveTo(x, y - s * 0.42);
      ctx.lineTo(x + s * 0.35, y);
      ctx.lineTo(x, y + s * 0.42);
      ctx.lineTo(x - s * 0.35, y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      break;
      
    case 'star':
      drawStar(x, y, 5, s * 0.42, s * 0.2);
      ctx.fill();
      ctx.stroke();
      break;
      
    case 'hexagon':
      drawPolygon(x, y, 6, s * 0.4);
      ctx.fill();
      ctx.stroke();
      break;
  }
  
  ctx.restore();
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const radius = i % 2 === 0 ? outerRadius : innerRadius;
    const angle = (Math.PI * i) / spikes - Math.PI / 2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawPolygon(cx, cy, sides, radius) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const angle = (Math.PI * 2 * i) / sides - Math.PI / 2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawHero(x, y) {
  const bounce = Math.sin(animationTime * 10) * 3;
  const runSpeed = animationTime * 15;
  
  ctx.save();
  ctx.shadowColor = '#4ecdc4';
  ctx.shadowBlur = 10;
  
  ctx.fillStyle = '#4ecdc4';
  ctx.fillRect(x - 8, y - 22 + bounce, 16, 26);
  
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath();
  ctx.arc(x, y - 32 + bounce, 12, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x + 3, y - 34 + bounce, 2.5, 0, Math.PI * 2);
  ctx.fill();
  
  const legAngle = Math.sin(runSpeed) * 0.4;
  ctx.strokeStyle = '#4ecdc4';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  
  ctx.beginPath();
  ctx.moveTo(x - 4, y + 4 + bounce);
  ctx.lineTo(x - 6 + Math.sin(legAngle) * 12, y + 22);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(x + 4, y + 4 + bounce);
  ctx.lineTo(x + 6 + Math.sin(legAngle + Math.PI) * 12, y + 22);
  ctx.stroke();
  
  const armAngle = Math.sin(runSpeed + Math.PI) * 0.5;
  ctx.beginPath();
  ctx.moveTo(x - 8, y - 15 + bounce);
  ctx.lineTo(x - 12 + Math.sin(armAngle) * 8, y - 5 + bounce);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(x + 8, y - 15 + bounce);
  ctx.lineTo(x + 12 + Math.sin(armAngle + Math.PI) * 8, y - 5 + bounce);
  ctx.stroke();
  
  ctx.restore();
}

function drawMonster(x, y) {
  const bounce = Math.sin(animationTime * 8) * 4;
  
  ctx.save();
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 20;
  
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(x, y - 18 + bounce, 20, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#c93d3d';
  ctx.beginPath();
  ctx.arc(x, y - 18 + bounce, 20, 0, Math.PI);
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - 8, y - 24 + bounce, 6, 0, Math.PI * 2);
  ctx.arc(x + 8, y - 24 + bounce, 6, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x - 8, y - 22 + bounce, 3.5, 0, Math.PI * 2);
  ctx.arc(x + 8, y - 22 + bounce, 3.5, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 14, y - 32 + bounce);
  ctx.lineTo(x - 8, y - 28 + bounce);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 14, y - 32 + bounce);
  ctx.lineTo(x + 8, y - 28 + bounce);
  ctx.stroke();
  
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x, y - 10 + bounce, 9, 0, Math.PI);
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(x - 8 + i * 4, y - 10 + bounce);
    ctx.lineTo(x - 6 + i * 4, y - 5 + bounce);
    ctx.lineTo(x - 4 + i * 4, y - 10 + bounce);
    ctx.closePath();
    ctx.fill();
  }
  
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.moveTo(x - 14, y - 34 + bounce);
  ctx.lineTo(x - 18, y - 48 + bounce);
  ctx.lineTo(x - 10, y - 36 + bounce);
  ctx.closePath();
  ctx.fill();
  
  ctx.beginPath();
  ctx.moveTo(x + 14, y - 34 + bounce);
  ctx.lineTo(x + 18, y - 48 + bounce);
  ctx.lineTo(x + 10, y - 36 + bounce);
  ctx.closePath();
  ctx.fill();
  
  ctx.restore();
}

function drawRoad() {
  const roadY = 130;
  const roadWidth = 620;
  const roadX = 40;
  
  ctx.save();
  
  const roadGrad = ctx.createLinearGradient(roadX, roadY, roadX, roadY + 80);
  roadGrad.addColorStop(0, '#2d2d2d');
  roadGrad.addColorStop(0.5, '#404040');
  roadGrad.addColorStop(1, '#2d2d2d');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(roadX, roadY, roadWidth, 80);
  
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 4;
  ctx.strokeRect(roadX, roadY, roadWidth, 80);
  
  ctx.strokeStyle = '#ffd93d';
  ctx.lineWidth = 4;
  ctx.setLineDash([25, 20]);
  ctx.lineDashOffset = -animationTime * 80;
  ctx.beginPath();
  ctx.moveTo(roadX, roadY + 40);
  ctx.lineTo(roadX + roadWidth, roadY + 40);
  ctx.stroke();
  ctx.setLineDash([]);
  
  const flagX = roadX + (goalPos / 100) * roadWidth;
  ctx.fillStyle = '#4ecdc4';
  ctx.shadowColor = '#4ecdc4';
  ctx.shadowBlur = 15;
  ctx.fillRect(flagX, roadY - 35, 6, 70);
  ctx.shadowBlur = 0;
  
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 3; j++) {
      ctx.fillStyle = (i + j) % 2 === 0 ? '#fff' : '#000';
      ctx.fillRect(flagX + 6, roadY - 35 + i * 17, 17, 17);
    }
  }
  
  const heroX = roadX + (heroPos / 100) * roadWidth;
  drawHero(heroX, roadY + 40);
  
  const monsterX = roadX + (Math.max(-15, monsterPos) / 100) * roadWidth;
  drawMonster(monsterX, roadY + 40);
  
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(20, 20, 250, 70);
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText(`TEMPO: ${Math.ceil(timeLeft)}s`, 35, 45);
  
  const barWidth = 200;
  const barHeight = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(35, 55, barWidth, barHeight);
  
  const timePercent = Math.max(0, timeLeft / maxTime);
  const gradient = ctx.createLinearGradient(35, 0, 35 + barWidth, 0);
  if (timePercent > 0.5) {
    gradient.addColorStop(0, '#4ecdc4');
    gradient.addColorStop(1, '#7ee8e0');
  } else if (timePercent > 0.25) {
    gradient.addColorStop(0, '#ffd93d');
    gradient.addColorStop(1, '#ffe580');
  } else {
    gradient.addColorStop(0, '#ff6b6b');
    gradient.addColorStop(1, '#ff9999');
  }
  ctx.fillStyle = gradient;
  ctx.shadowColor = timePercent > 0.5 ? '#4ecdc4' : timePercent > 0.25 ? '#ffd93d' : '#ff6b6b';
  ctx.shadowBlur = 10;
  ctx.fillRect(35, 55, barWidth * timePercent, barHeight);
  ctx.shadowBlur = 0;
  
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(canvas.width - 200, 20, 180, 45);
  
  ctx.fillStyle = '#ffd93d';
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'right';
  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur = 8;
  ctx.fillText(`PUNTI: ${score}`, canvas.width - 35, 50);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(canvas.width / 2 - 70, 20, 140, 35);
  
  ctx.fillStyle = '#a29bfe';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`LIVELLO ${level}`, canvas.width / 2, 45);
  ctx.textAlign = 'left';
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Arial';
  ctx.fillText(`Distanza: ${Math.floor(heroPos / goalPos * 100)}%`, 35, 255);
  
  if (combo > 1) {
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffd93d';
    ctx.shadowBlur = 15;
    ctx.fillText(`COMBO x${combo}`, canvas.width / 2, 280);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
  }
  
  ctx.restore();
}

function drawGrid() {
  ctx.save();
  
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(gridOffsetX - 15, gridOffsetY - 15, gridSize * cellSize + 30, gridSize * cellSize + 30);
  
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const x = gridOffsetX + c * cellSize;
      const y = gridOffsetY + r * cellSize;
      
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
      
      if (selectedCell && selectedCell.row === r && selectedCell.col === c) {
        ctx.strokeStyle = '#ffd93d';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ffd93d';
        ctx.shadowBlur = 15;
        ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
        ctx.shadowBlur = 0;
      }
      
      if (grid[r][c]) {
        if (grid[r][c].offsetY < 0) {
          grid[r][c].offsetY = Math.min(0, grid[r][c].offsetY + 12);
        }
        
        let drawX = x + cellSize / 2;
        let drawY = y + cellSize / 2 + grid[r][c].offsetY;
        
        if (swapAnimation && !swapAnimation.reverting) {
          const { r1, c1, r2, c2, progress } = swapAnimation;
          if ((r === r1 && c === c1) || (r === r2 && c === c2)) {
            const otherR = r === r1 ? r2 : r1;
            const otherC = c === c1 ? c2 : c1;
            const t = Math.min(1, progress);
            const ease = t < 0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
            drawX = x + cellSize/2 + (otherC - c) * cellSize * ease;
            drawY = y + cellSize/2 + (otherR - r) * cellSize * ease;
          }
        }
        
        drawSymbol(drawX, drawY, grid[r][c], cellSize);
      }
    }
  }
  
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    
    if (p.type === 'spark') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size / 2;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.restore();
  });
}

function drawFloatingTexts() {
  floatingTexts.forEach(t => {
    ctx.save();
    ctx.globalAlpha = t.life;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 15;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  });
}

function drawLevelComplete() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.textAlign = 'center';
  ctx.font = 'bold 60px Arial';
  ctx.fillStyle = '#4ecdc4';
  ctx.shadowColor = '#4ecdc4';
  ctx.shadowBlur = 30;
  ctx.fillText('TRAGUARDO!', canvas.width / 2, canvas.height / 2 - 60);
  
  ctx.font = 'bold 40px Arial';
  ctx.fillStyle = '#ffd93d';
  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur = 20;
  ctx.fillText(`LIVELLO ${level} COMPLETATO`, canvas.width / 2, canvas.height / 2);
  
  ctx.font = '24px Arial';
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 0;
  ctx.fillText('Preparati al prossimo...', canvas.width / 2, canvas.height / 2 + 60);
  ctx.restore();
}

function drawEndScreen(won) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.textAlign = 'center';
  
  ctx.font = 'bold 64px Arial';
  ctx.fillStyle = won ? '#4ecdc4' : '#ff6b6b';
  ctx.shadowColor = won ? '#4ecdc4' : '#ff6b6b';
  ctx.shadowBlur = 40;
  ctx.fillText(won ? 'HAI VINTO!' : 'TI HA PRESO!', canvas.width / 2, canvas.height / 2 - 80);
  ctx.shadowBlur = 0;
  
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = '#ffd93d';
  ctx.fillText(`PUNTEGGIO: ${score}`, canvas.width / 2, canvas.height / 2);
  
  ctx.font = 'bold 28px Arial';
  ctx.fillStyle = '#a29bfe';
  ctx.fillText(`LIVELLO RAGGIUNTO: ${level}`, canvas.width / 2, canvas.height / 2 + 50);
  
  ctx.font = '22px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('Clicca per tornare al menu', canvas.width / 2, canvas.height / 2 + 120);
  
  ctx.restore();
}

// ==================== GAME LOOP ====================
let lastTimestamp = 0;

function gameLoop(timestamp) {
  if (gameState === 'menu') return;
  
  const deltaTime = timestamp - lastTimestamp;
  lastTimestamp = timestamp;
  animationTime = timestamp / 1000;
  
  if (gameState === 'playing') {
    timeLeft -= deltaTime / 1000;
    
    if (timeLeft <= 5 && timeLeft > 0 && Math.floor(timeLeft * 2) !== Math.floor((timeLeft + deltaTime/1000) * 2)) {
      audio.play('tick');
    }
    
    const monsterSpeed = difficulty === 1 ? 1 : 1.4;
    monsterPos = -15 + (1 - timeLeft / maxTime) * (heroPos + 12) * monsterSpeed;
    
    if (timeLeft <= 0 || monsterPos >= heroPos - 3) {
      gameState = 'lose';
      audio.play('lose');
      screenShake = 20;
      setTimeout(() => {
        canvas.onclick = () => {
          gameState = 'menu';
          document.getElementById('menu').classList.remove('hidden');
          canvas.onclick = null;
        };
      }, 500);
    }
    
    updateSwapAnimation();
  }
  
  updateParticles();
  
  ctx.save();
  
  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );
    screenShake *= 0.9;
    if (screenShake < 0.5) screenShake = 0;
  }
  
  ctx.clearRect(-20, -20, canvas.width + 40, canvas.height + 40);
  
  drawRoad();
  drawHUD();
  drawGrid();
  drawParticles();
  drawFloatingTexts();
  
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
    flashAlpha -= 0.05;
  }
  
  ctx.restore();
  
  if (gameState === 'levelcomplete') {
    drawLevelComplete();
  } else if (gameState === 'win' || gameState === 'lose') {
    drawEndScreen(gameState === 'win');
  }
  
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
