<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎮 Mini Games Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:Rubik,system-ui,sans-serif;color:#fff;
  background:radial-gradient(900px 520px at 15% -10%,rgba(124,77,255,.35),transparent 60%),
    radial-gradient(820px 520px at 110% 115%,rgba(0,229,255,.16),transparent 60%),
    linear-gradient(165deg,#160a2e,#0d1b36);
  display:flex;flex-direction:column;align-items:center;padding:40px 16px}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(18px,4vw,30px);
  text-shadow:0 0 18px rgba(124,77,255,.9);margin-bottom:8px;text-align:center}
.sub{opacity:.75;margin-bottom:32px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;
  width:100%;max-width:900px}
.card{display:block;text-decoration:none;color:#fff;background:linear-gradient(170deg,rgba(60,30,110,.6),rgba(15,25,55,.7));
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:22px;text-align:center;
  transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(124,77,255,.35)}
.card .icon{font-size:52px;margin-bottom:10px}
.card h2{font-family:'Press Start 2P',monospace;font-size:12px;margin-bottom:8px}
.card p{font-size:13px;opacity:.75;line-height:1.5}
.soon{opacity:.45;cursor:not-allowed}
footer{margin-top:40px;font-size:12px;opacity:.5}
</style>
</head>
<body>
  <h1>🎮 MINI GAMES ARCADE</h1>
  <div class="sub">Pick a game and have fun!</div>
  <div class="grid">
    <a class="card" href="monster-smash.html">
      <div class="icon">👾</div>
      <h2>MONSTER SMASH</h2>
      <p>Squash monsters before their timer runs out. Daily challenge, bosses, gems & more!</p>
    </a>
    <div class="card soon">
      <div class="icon">🔒</div>
      <h2>COMING SOON</h2>
      <p>More mini-games are on the way…</p>
    </div>
  </div>
  <footer>© 2026 Mini Games Arcade</footer>
</body>
</html>
